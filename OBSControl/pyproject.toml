[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obscontrol"
version = "0.4.0"
description = "Desktop OBS controller for NewTek control surfaces"
requires-python = ">=3.10"
dependencies = [
    "control-surfaces>=0.2.0",
    "websocket-client>=1.8",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
obscontrol = "obscontrol.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
